# git-cliff (SPEC §19 Changelog, §21): CHANGELOG.md and the GitHub release notes from the Conventional Commit squash
# titles that pr-title.yml enforces. Only v2.x tags count: the 1.x tags belong to main.
[changelog]
header = """
# Changelog

All notable changes to Ducky 2.x are recorded here. The file is generated by git-cliff from Conventional Commits
at release time (SPEC §21); Ducky 1.x history stays on `main`.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = "^(test|build|ci)", group = "<!-- 6 -->Engineering" },
  { message = "^(chore|style)", skip = true },
]
tag_pattern = "^v2\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
