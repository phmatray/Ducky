# Hand-written (SPEC §20.1, M0-15): VerifyWorkflows does not regenerate it, but checks its jobs (MutationWorkflowViolations
# in build/Build.MutationShards.cs) and that its job names are unique across workflows (§20.2).
# mutation-plan decides whether the PR can change a mutation result at all (MutationPlan). If it can, four shard jobs run
# MutationPr on disjoint partitions of each project's files, restoring the merge base's baseline report when one was
# cached (§17.8). The required check `mutation` merges their reports (MutationPrAggregate): it recomputes the plan itself,
# so a skipped PR needs no shard and any other PR needs every shard, whatever happened to the jobs before it.
name: mutation

on:
  pull_request:
    branches:
      - v2
      - main

permissions:
  contents: read

jobs:
  mutation-plan:
    name: mutation-plan
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      merge-base: ${{ steps.plan.outputs.merge-base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Run: MutationPlan'
        id: plan
        run: ./build.sh MutationPlan

  mutation-shard:
    name: mutation-shard-${{ matrix.shard }}
    needs: mutation-plan
    if: needs.mutation-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: mutation baseline of the merge base'
        uses: actions/cache/restore@v6
        with:
          path: artifacts/mutation/baseline
          key: mutation-baseline-${{ needs.mutation-plan.outputs.merge-base }}
      - name: 'Run: MutationPr shard'
        run: ./build.sh MutationPr --shard ${{ matrix.shard }}/4
      - name: 'Upload: shard report'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: artifacts/mutation-shards
          if-no-files-found: ignore

  mutation:
    name: mutation
    needs: mutation-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Download: shard reports'
        if: needs.mutation-shard.result != 'skipped'
        uses: actions/download-artifact@v5
        with:
          pattern: mutation-shard-*
          path: artifacts/mutation-shards
      - name: 'Run: MutationPrAggregate'
        run: ./build.sh MutationPrAggregate --shards 4
