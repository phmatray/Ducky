# Hand-written (SPEC §20.1): VerifyWorkflows checks only its job name, unique across workflows (§20.2).
# On a release, the Docs target renders the guides to artifacts/docs; the home page (site/) goes to the root of GitHub
# Pages, the guides under docs/ and the Ducky Playground (samples/Ducky.Playground) under playground/. Ducky.Samples.Wasm is
# the E2E and trimmed-AOT fixture only; it is not published. release.yml creates the GitHub release with
# GITHUB_TOKEN, and an event raised by that token starts no workflow, so a successful release run also triggers this
# one; workflow_dispatch redeploys by hand.
name: docs

on:
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    name: docs
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Run: Docs'
        run: ./build.sh Docs
      # No wasm-tools workload: the playground publishes workload-free, the same build the E2E target verifies.
      - name: 'Publish: Playground'
        run: dotnet publish samples/Ducky.Playground/Ducky.Playground.csproj -c Release -o artifacts/playground
      - name: 'Assemble: Pages'
        run: |
          # The home page (site/) at the root, the generated docs under docs/, the playground under playground/. The design
          # records of site/ (PRODUCT.md, DESIGN.md, .impeccable/) and the docs theme (copied into docs/_assets by Docs) stay out.
          mkdir -p artifacts/pages
          rsync -a --exclude '.impeccable/' --exclude 'PRODUCT.md' --exclude 'DESIGN.md' --exclude 'docs-theme/' site/ artifacts/pages/
          cp -r artifacts/docs artifacts/pages/docs
          cp -r artifacts/playground/wwwroot artifacts/pages/playground
          # The site is served from /<repository>/, the playground from /<repository>/playground/.
          sed -i 's|<base href="/" */>|<base href="/${{ github.event.repository.name }}/playground/" />|' artifacts/pages/playground/index.html
          grep -q '<base href="/${{ github.event.repository.name }}/playground/"' artifacts/pages/playground/index.html
          # 404.html is served at any depth, so its base is the site root.
          sed -i 's|<base href="/Ducky/">|<base href="/${{ github.event.repository.name }}/">|' artifacts/pages/404.html
          grep -q '<base href="/${{ github.event.repository.name }}/">' artifacts/pages/404.html
          test -f artifacts/pages/index.html && test -f artifacts/pages/tokens.css && test -f artifacts/pages/docs/index.html && test -f artifacts/pages/docs/_assets/docs.css && test -f artifacts/pages/docs/llms-full.txt && test -f artifacts/pages/llms.txt
          test -f artifacts/pages/playground/tokens.css && test -f artifacts/pages/playground/_source/Program.cs.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/pages
      - id: deploy
        uses: actions/deploy-pages@v5
