# Hand-written (SPEC §20.1, M0-15): VerifyWorkflows does not regenerate it, but checks its jobs (MutationWorkflowViolations
# in build/Build.MutationShards.cs) and that its job names are unique across workflows (§20.2).
# The full Mutation run, nightly and on every push to v2, as four shard jobs on disjoint partitions of each project's
# files; nightly-mutation merges their reports (MutationAggregate), applies Mutation's checks, opens the below-90 issue,
# and caches each project's merged report by commit SHA as the baseline MutationPr may reuse (§17.8). MutationForSha
# finds a successful run of this workflow for the tagged SHA, scheduled or pushed.
name: nightly-mutation

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - v2

# Queued, never cancelled: a cancelled run would open a failure issue; GitHub drops a superseded pending run itself.
concurrency:
  group: nightly-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-mutation-shard:
    name: nightly-mutation-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Run: Mutation shard'
        run: ./build.sh Mutation --shard ${{ matrix.shard }}/4
      - name: 'Upload: shard report'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-mutation-shard-${{ matrix.shard }}
          path: artifacts/mutation-shards
          if-no-files-found: ignore

  nightly-mutation:
    name: nightly-mutation
    needs: nightly-mutation-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Download: shard reports'
        uses: actions/download-artifact@v5
        with:
          pattern: nightly-mutation-shard-*
          path: artifacts/mutation-shards
      - name: 'Run: MutationAggregate'
        run: ./build.sh MutationAggregate --shards 4
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 'Save: mutation baseline'
        if: ${{ !cancelled() && hashFiles('artifacts/mutation/baseline/*.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: artifacts/mutation/baseline
          key: mutation-baseline-${{ github.sha }}
      - name: 'Report: nightly failure'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: nightly-mutation failed
        run: |
          number=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq 'map(select(.title == env.TITLE)) | first | .number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN_URL"
          fi
        if: failure() || cancelled()
